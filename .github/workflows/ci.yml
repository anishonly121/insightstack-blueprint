name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightstack
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/insightstack
      JWT_SECRET: ci-placeholder-jwt-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: InsightStack
      OPENAI_API_KEY: ""
      SENDGRID_API_KEY: ""
      SENDGRID_FROM_EMAIL: no-reply@example.com
      SENDGRID_TEMPLATE_RESET_PASSWORD: d-placeholder-template-id
      SENDGRID_TEMPLATE_ALERT: ""
      SENDGRID_PASSWORD_RESET_TEMPLATE_ID: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            echo "value=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "value=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Prisma validate
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
